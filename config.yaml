# ==============================================================================
# Aerial Configuration Template (config.yaml)
# Place in your private configuration repository to customize Aerial's runtime.
# ==============================================================================

# 1. Agent Model & Runtime Options
# Primary high-effort model for multi-step reasoning, coding, and complex tasks
model: "Gemini 3.8 Flash (High)"

# Low-effort model for ambient classification, triage, and background routines
low_effort_model: "Gemini 3.8 Flash (Low)"

# Timezone for scheduled cron routines and timestamp rendering
timezone: "America/Los_Angeles"

# 2. Discord System Channel
# Channel name or snowflake ID for startup announcements and diagnostic alerts
system_channel: "aerial-dev"

# 3. Core Microservices (*.aerial Cluster CoreDNS)
vanadis_url: "http://vanadis.aerial"
haro_url: "http://haro.aerial"
coven_url: "http://coven.aerial"
docket_url: "http://docket.aerial"

# 4. Administrator Allowlist
# Numeric Discord Snowflake IDs or Discord usernames authorized to perform system-level operations
# (modifying system prompts, config.yaml, or scheduled crons).
# Messages from these users are tagged with is_admin: true.
admin_users:
  - "123456789012345678" # Example Admin Snowflake ID
  # - "admin_username"    # Example Admin Discord Username

# 5. Channel Policies & Interaction Modes
# Configure interaction mode and sensitivity per Discord channel.
# Lookup order: Channel Snowflake ID -> Channel Name (without '#') -> default.
#
# Available Modes (mode):
#   - threads: Direct mentions or messages spawn/route to a Discord thread (default).
#   - channel: Messages are evaluated directly in-channel without threads.
#   - ignore (or disabled): Channel is completely ignored by Aerial.
#
# Available Wake Modes (wake_mode):
#   - classifier: Direct mentions, direct replies, and ambient relevance scoring via the low-effort model.
#   - mention: Strictly responds to explicit @mentions or direct replies. Ambient channel chatter
#     is silently recorded in transcript history for conversational lookback.
#   - all: Responds to every message (default inside an active thread).
#
# Ambient Classification (for wake_mode: classifier):
#   - ambient_wake_threshold: Confidence score threshold (0.0 to 1.0) to wake Aerial (default: 0.80).
#   - ambient_wake_prompt: Custom criteria/directive for the ambient relevance classifier.
#   - ignore_bots: Ignore messages from bot accounts (default: true).
channels:
  # The 'default' block is REQUIRED and acts as the fallback for all channels.
  default:
    mode: threads
    ignore_bots: true
    ambient_wake_threshold: 0.80

  # Example channel-specific override for in-channel direct interaction with classifier:
  general:
    mode: channel
    wake_mode: classifier
    ignore_bots: true
    ambient_wake_threshold: 0.80
    ambient_wake_prompt: "Determine whether the target message is relevant to Aerial and warrants waking up and responding, based on recent channel context."

  # Example channel with mention-only wake:
  lounge:
    mode: channel
    wake_mode: mention
    ignore_bots: false

  # Example channel-specific override to completely ignore noisy channels:
  memes:
    mode: ignore

# 6. Model Context Protocol (MCP) Microservices (*.aerial)
# Configure MCP server endpoints reachable across the internal Kubernetes cluster mesh.
# Environment variables ${VAR} are interpolated dynamically from Kubernetes secrets.
mcp_servers:
  common:
    memory:
      serverUrl: "http://coven.aerial/mcp"
    scheduler:
      serverUrl: "http://haro.aerial/mcp"
    docket:
      serverUrl: "http://docket-mcp.aerial/mcp"
    github:
      serverUrl: "http://github-mcp.aerial/mcp"
      headers:
        Authorization: "Bearer ${GITHUB_PAT}"
  discord:
    kubernetes:
      serverUrl: "http://kubernetes-mcp.aerial/mcp"
    discord:
      serverUrl: "http://discord-mcp.aerial/mcp"
    victoriametrics:
      serverUrl: "http://victoriametrics-mcp.aerial/mcp"
    kernel:
      serverUrl: "http://kernel-mcp.aerial/mcp"
    vanadis:
      serverUrl: "http://vanadis.aerial/mcp"
