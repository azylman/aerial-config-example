# ==============================================================================
# Aerial User Configuration (config.yaml)
# Example template: https://github.com/azylman/aerial-config-example
# ==============================================================================

# 1. Agent Model & Runtime Options
model: "Gemini 3.6 Flash (Low)"
timeout_minutes: 15
timezone: "America/Los_Angeles"

# 2. Discord System Channel
system_channel: "aerial-dev"

# 3. Multi-Repository Git Synchronization
git_sync:
  enabled: true
  interval: "60s"
  config_repo_url: "https://github.com/your-username/your-aerial-config.git"
  repositories:
    - "/share/aerial-config"
    - "/share/aerial"

# 4. Custom MCP Servers (Optional)
# Define additional remote Model Context Protocol servers
# Environment variables `${VAR}` are interpolated from host `.env`
mcp_servers:
  brave-search:
    serverUrl: "http://brave-mcp:4005/mcp"
  # custom-api:
  #   serverUrl: "https://mcp.example.com/sse"
  #   headers:
  #     Authorization: "Bearer ${CUSTOM_API_KEY}"
