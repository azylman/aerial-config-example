# ==============================================================================
# Cluster Overrides & GitOps Flux Definitions (k8s/cluster-overrides.yaml)
# ==============================================================================
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: aerial
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: main
  timeout: 60s
  url: https://github.com/azylman/aerial.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aerial-operators
  namespace: flux-system
spec:
  interval: 5m
  path: ./k8s/operators
  prune: true
  sourceRef:
    kind: GitRepository
    name: aerial
  timeout: 5m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aerial-core
  namespace: flux-system
spec:
  dependsOn:
    - name: aerial-operators
  force: false
  interval: 5m
  path: ./k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: aerial
  timeout: 5m
  wait: false
  postBuild:
    # AERIAL_CONFIG_REPO_URL is automatically populated in ConfigMap/aerial-image-tags
    # by Job/infisical-bootstrap from GitRepository/flux-system during cluster bootstrap.
    substituteFrom:
    - kind: ConfigMap
      name: aerial-image-tags
      optional: true
