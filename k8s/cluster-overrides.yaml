apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aerial-config
  namespace: flux-system
spec:
  force: false
  interval: 5m
  path: ./k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: aerial-config
  timeout: 5m
  wait: false
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: aerial-image-tags
      optional: true
