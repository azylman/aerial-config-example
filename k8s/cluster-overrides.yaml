# ==============================================================================
# Cluster Overrides & GitOps Flux Definitions (k8s/cluster-overrides.yaml)
# ==============================================================================
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: aerial
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: main
  timeout: 60s
  url: https://github.com/azylman/aerial.git
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: aerial-config
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: main
  secretRef:
    name: github-auth
  timeout: 60s
  url: https://github.com/example-user/aerial-config.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aerial-core
  namespace: flux-system
spec:
  force: false
  interval: 5m
  path: ./k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: aerial
  timeout: 5m
  wait: false
  postBuild:
    substitute:
      AERIAL_CONFIG_REPO_URL: "https://github.com/example-user/aerial-config.git"
    substituteFrom:
    - kind: ConfigMap
      name: aerial-image-tags
      optional: true
